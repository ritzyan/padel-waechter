name: Padel Slot Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Slot prüfen
        run: python check_slot.py
        env:
          PLAYTOMIC_TENANT_ID: ${{ secrets.PLAYTOMIC_TENANT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Status speichern
        run: |
          git config user.name "padel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add notified.txt
          git diff --staged --quiet || (git commit -m "update state" && git push)
